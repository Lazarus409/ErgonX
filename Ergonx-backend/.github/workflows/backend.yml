name: Backend checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ergonx_test
          POSTGRES_USER: ergonx
          POSTGRES_PASSWORD: ergonx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ergonx -d ergonx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test_postgres
      POSTGRES_DB: ergonx_test
      POSTGRES_USER: ergonx
      POSTGRES_PASSWORD: ergonx
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements/development.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate
      - run: python manage.py check
      - run: pytest
