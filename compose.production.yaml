services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Ergonx-backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-15}
      JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-15}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-}
      BFF_PROXY_SECRET: ${BFF_PROXY_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-40}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py createcachetable &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./ergonx-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_ENABLE_DEV_AUTH_BYPASS: "false"
    restart: unless-stopped
    environment:
      BFF_PROXY_SECRET: ${BFF_PROXY_SECRET:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"

  # Daily database backups: a pg_dump (custom format) into ./backups on the host,
  # keeping BACKUP_KEEP_DAYS days. Copy that folder off the server too (another
  # disk, a bucket, or the office): a backup on the same machine does not survive
  # losing the machine. Check one with scripts/restore-test.ps1.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        while true; do
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          file=/backups/ergonx-$$stamp.dump
          if pg_dump --format=custom --no-owner --file="$$file.partial" && pg_restore --list "$$file.partial" > /dev/null; then
            mv "$$file.partial" "$$file"
            echo "backup written: $$file"
          else
            echo "backup FAILED at $$stamp" >&2
          fi
          # Only this service's own files: failed partial dumps and backups past the keep period.
          find /backups -maxdepth 1 -name 'ergonx-*.dump.partial' -mmin +60 -delete
          find /backups -maxdepth 1 -name 'ergonx-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep "$$BACKUP_INTERVAL_SECONDS"
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  production_postgres_data:
