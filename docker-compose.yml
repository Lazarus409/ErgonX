services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ergonx}
      POSTGRES_USER: ${POSTGRES_USER:-ergonx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ergonx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ergonx} -d ${POSTGRES_DB:-ergonx}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ergonx_postgres_data:/var/lib/postgresql/data

volumes:
  ergonx_postgres_data:
