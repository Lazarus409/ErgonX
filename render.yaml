services:
  - type: web
    runtime: docker
    name: ergonx-api
    dockerfilePath: Ergonx-backend/Dockerfile
    dockerContext: Ergonx-backend
    healthCheckPath: /api/v1/schema/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ergonx-postgres
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: JWT_ACCESS_MINUTES
        value: "15"
      - key: JWT_REFRESH_DAYS
        value: "7"

  - type: web
    runtime: docker
    name: ergonx-web
    dockerfilePath: ergonx-frontend/Dockerfile
    dockerContext: ergonx-frontend
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_ENABLE_DEV_AUTH_BYPASS
        value: "false"

databases:
  - name: ergonx-postgres
    databaseName: ergonx
    user: ergonx
    postgresMajorVersion: "16"
